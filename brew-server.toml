listen = "0.0.0.0:9000"
websocket_path = "/brew"
websocket_subprotocol = "brew"
route_without_affiliations = true
fallback_broadcast_when_no_affiliations = true
allow_multiple_calls_per_group = true
higher_priority_number_wins = true
preempt_cause = 1

[tls]
enabled = false
cert_path = "/etc/letsencrypt/live/ct1jib.dyndns.org/fullchain.pem"
key_path = "/etc/letsencrypt/live/ct1jib.dyndns.org/privkey.pem"

[auth]
enabled = true
realm = "brew-server"
session_ttl_seconds = 300

[aprs]
enabled = true

# GSSI/TG used as the APRS gateway destination
talkgroup = 200999

# APRS-IS server
server = "portugal.aprs2.net"
port = 14580

# APRS-IS login of the gateway
login_callsign = "xxxxxx"
passcode = -1

# Existing radio-ID database. Only radio_id, callsign and fname are read.
users_file = "/etc/brew-server/users.json"

# APRS symbol: /> = car
symbol_table = "/"
symbol = "["

reconnect_seconds = 15
users_reload_seconds = 60

[auth.users]
"100000001" = "change-me-bs1"
"100000002" = "change-me-bs2"
